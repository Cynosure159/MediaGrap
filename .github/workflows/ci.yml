name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  verify:
    name: Go and web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go format check
        run: |
          files=$(gofmt -l cmd internal)
          if [ -n "$files" ]; then printf '%s\n' "$files"; exit 1; fi
      - name: Go static checks
        run: go vet ./...
      - name: Go tests with race detector
        run: go test -race ./...
      - name: Release script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Web typecheck
        run: npm --prefix web run typecheck
      - name: Web tests
        run: npm --prefix web run test
      - name: Web production build
        run: npm --prefix web run build

  docker:
    name: Docker (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Export clean source context
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 scripts/release-context.py --tag "$REF_NAME" \
              --output "$RUNNER_TEMP/context"
          else
            python3 scripts/release-context.py --test-snapshot \
              --output "$RUNNER_TEMP/context"
          fi
      - name: Build candidate image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker buildx build --platform "linux/$ARCH" --load \
            --tag "mediagrap:ci-$ARCH" "$RUNNER_TEMP/context"
      - name: Verify source and non-root runtime
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/verify-image.py "mediagrap:ci-$ARCH" \
            --output "$RUNNER_TEMP/evidence"
      - name: Rebuild from downloaded source
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/rebuild-source.py \
            "$RUNNER_TEMP/evidence/source.tar.gz" \
            --output "$RUNNER_TEMP/rebuild"
          docker buildx build --platform "linux/$ARCH" --load \
            --tag "mediagrap:rebuild-$ARCH" "$RUNNER_TEMP/rebuild"
          python3 scripts/verify-image.py "mediagrap:rebuild-$ARCH" \
            --output "$RUNNER_TEMP/rebuild-evidence"
      - name: Save tested release image
        if: github.ref_type == 'tag'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker save "mediagrap:ci-$ARCH" | \
            gzip > "$RUNNER_TEMP/evidence/image.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.arch }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified DockerHub images
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, docker]
    runs-on: ubuntu-latest
    concurrency:
      group: mediagrap-dockerhub-publication
      cancel-in-progress: false
    env:
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'cynosure159/mediagrap' }}
      REF_NAME: ${{ github.ref_name }}
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          path: candidates
      - name: Validate publication inputs
        run: python3 scripts/validate-publication.py candidates
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish only the tested images
        shell: bash
        run: |
          set -euo pipefail
          version=${REF_NAME#v}
          for arch in amd64 arm64; do
            docker load -i "candidates/distribution-$arch/image.tar.gz"
            expected=$(python3 -c \
              'import json,sys;print(json.load(open(sys.argv[1]))["imageID"])' \
              "candidates/distribution-$arch/verification.json")
            actual=$(docker image inspect "mediagrap:ci-$arch" \
              --format '{{.Id}}')
            test "$actual" = "$expected"
            docker tag "mediagrap:ci-$arch" "$IMAGE:$version-$arch"
            docker push "$IMAGE:$version-$arch"
          done
          docker buildx imagetools create --tag "$IMAGE:$version" \
            "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
          if [[ "$version" != *-* ]]; then
            docker buildx imagetools create --tag "$IMAGE:latest" \
              "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
          fi
