name: CI

on:
  push:
    branches: [main, dev]
    # Scripts enforce canonical versions and current branch tips.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# Stop superseded dev checks; tag publication candidates are not canceled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  verify:
    name: Go and web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go format check
        run: |
          files=$(gofmt -l cmd internal)
          if [ -n "$files" ]; then printf '%s\n' "$files"; exit 1; fi
      - name: Go static checks
        run: go vet ./...
      - name: Go tests with race detector
        run: go test -race ./...
      - name: Release script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Web typecheck
        run: npm --prefix web run typecheck
      - name: Web tests
        run: npm --prefix web run test
      - name: Web production build
        run: npm --prefix web run build

  docker:
    name: Docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Export clean source context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
          IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'cynosure159/mediagrap' }}
        run: |
          if [ "$EVENT_NAME" = push ] && [[ "$REF" == refs/tags/* ]]; then
            python3 scripts/validate-publication.py --guard-only
            python3 scripts/release-context.py --tag "$REF_NAME" \
              --output "$RUNNER_TEMP/context"
          else
            python3 scripts/release-context.py --test-snapshot \
              --output "$RUNNER_TEMP/context"
          fi
      - name: Build candidate and external source assets
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker buildx build --platform "linux/$ARCH" --load \
            --tag "mediagrap:ci-$ARCH" "$RUNNER_TEMP/context"
          docker buildx build --platform "linux/$ARCH" --target artifacts \
            --output "type=local,dest=$RUNNER_TEMP/artifacts" \
            "$RUNNER_TEMP/context"
      - name: Verify pinned redirect and source using owned HTTP fixture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/verify-image.py "mediagrap:ci-$ARCH" \
            --source-directory "$RUNNER_TEMP/artifacts/distribution" \
            --output "$RUNNER_TEMP/evidence"
      - name: Rebuild from fixture-downloaded source
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/rebuild-source.py \
            "$RUNNER_TEMP/evidence/source.tar.gz" \
            --output "$RUNNER_TEMP/rebuild"
          docker buildx build --platform "linux/$ARCH" --load \
            --tag "mediagrap:rebuild-$ARCH" "$RUNNER_TEMP/rebuild"
          docker buildx build --platform "linux/$ARCH" --target artifacts \
            --output "type=local,dest=$RUNNER_TEMP/rebuild-artifacts" \
            "$RUNNER_TEMP/rebuild"
          python3 scripts/verify-image.py "mediagrap:rebuild-$ARCH" \
            --source-directory "$RUNNER_TEMP/rebuild-artifacts/distribution" \
            --output "$RUNNER_TEMP/evidence/rebuild"
          cmp "$RUNNER_TEMP/evidence/source.tar.gz" \
            "$RUNNER_TEMP/evidence/rebuild/source.tar.gz"
      - name: Save tested publication candidate
        if: >-
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v')
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker save "mediagrap:ci-$ARCH" | \
            gzip > "$RUNNER_TEMP/evidence/image.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.arch }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish matching source then verified DockerHub images
    if: >-
      github.repository == 'Cynosure159/MediaGrap' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    needs: [verify, docker]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: >-
        mediagrap-publication-${{ contains(github.ref, '-rc.') &&
        'preview' || 'stable' }}
      cancel-in-progress: false
    env:
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'cynosure159/mediagrap' }}
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          path: candidates
      - name: Validate channel, remote branch tip and matching candidates
        run: python3 scripts/validate-publication.py candidates
      - name: Retain matching source and verify anonymous downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-source.py candidates
      - uses: actions/upload-artifact@v4
        with:
          name: public-source-verification
          path: candidates/public-source-verification.json
          if-no-files-found: error
          retention-days: 30
      - name: Recheck branch eligibility before registry login
        run: python3 scripts/validate-publication.py --guard-only
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish tested images with immutable tag and stale-ref guards
        run: python3 scripts/publish-images.py candidates
