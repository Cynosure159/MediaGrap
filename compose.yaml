services:
  mediagrap:
    build:
      context: ${MEDIAGRAP_BUILD_CONTEXT:?Export a source context first}
      target: ffprobe
    image: cynosure159/mediagrap:latest
    container_name: mediagrap
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MEDIAGRAP_CONFIG_DIR: /config
      MEDIAGRAP_CACHE_DIR: /cache
      MEDIAGRAP_LOG_FORMAT: json
    volumes:
      - ./runtime/config:/config
      - ./runtime/cache:/cache
      # Add only explicit media mounts and keep first setup isolated.
      # - /srv/media/movies:/media/movies:ro
    security_opt:
      - no-new-privileges:true
